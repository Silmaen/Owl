FormatVersion: 1
OwlProject:
  name: OwlEngineDemo
  firstScene: scenes/main_menu.owl
  author: Silmaen
  description: ho ho ho
  icon: logo/logo_owl.png
  gamepadMappings: input/gamecontrollerdb.txt
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true
  RendererStack:
    - Type: Renderer2D
      Name: world
    - Type: RendererRaycast
      Name: raycast_world
      DefaultConfig:
        Fov: 75.0
        MaxDistance: 32.0
        CeilingColor: [0.18, 0.20, 0.30, 1.0]
        FloorColor: [0.20, 0.16, 0.12, 1.0]
    - Type: RendererVoxel
      Name: voxel_world
      DefaultConfig:
        SunDirection: [-0.4, -1.0, -0.6]
        Ambient: [0.4, 0.4, 0.45]
    - Type: RendererMesh
      Name: mesh_world
      DefaultConfig:
        SunDirection: [-0.4, -1.0, -0.6]
        Ambient: [0.4, 0.4, 0.45]
    - Type: RendererIsometric
      Name: iso_world
      DefaultConfig:
        TileWidth: 64
        TileHeight: 32
        ZStep: 16
        Zoom: 0
    - Type: Renderer2D
      Name: ui
    - Type: Renderer2D
      Name: overlay