OwlProject:
  name: OwlTowerDefence
  firstScene: scenes/title.owl
  author: Silmaen
  description: Tower defence, a sample game of the Owl Engine
  icon: logo/logo_owl.png
  gamepadMappings: input/gamecontrollerdb.txt
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true
  RendererStack:
    - Type: Renderer2D
      Name: world
    - Type: RendererMesh
      Name: mesh_world
      DefaultConfig:
        SunDirection: [-0.4, -1.0, -0.6]
        Ambient: [0.4, 0.4, 0.45]
    - Type: Renderer2D
      Name: ground
      DefaultConfig:
        DepthTest: true
    - Type: Renderer2D
      Name: sprites
      DefaultConfig:
        Billboard: Full
        DepthTest: true
    - Type: Renderer2D
      Name: marks
      DefaultConfig:
        Billboard: Full
    - Type: Renderer2D
      Name: ui
    - Type: Renderer2D
      Name: overlay
