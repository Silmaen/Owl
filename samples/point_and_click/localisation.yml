  - key: ending.line1
    table: menu
    values: {en: 'The moonstone wakes, the fireflies give it their spark...', fr: 'La pierre de lune s''éveille, les lucioles lui donnent leur étincelle...'}
  - key: ending.line2
    table: menu
    values: {en: '...and the Moon Lantern shines over the whole valley again.', fr: '...et la Lanterne de Lune brille de nouveau sur toute la vallée.'}
  - key: ending.line3
    table: menu
    values: {en: 'Tonight the fairies will find their way home. And Barnaby will finally find his slippers.', fr: 'Cette nuit, les fées retrouveront leur chemin. Et Barnaby retrouvera enfin ses pantoufles.'}
  - key: ending.end
    table: menu
    values: {en: 'The End', fr: 'Fin'}
