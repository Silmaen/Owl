# Nightly child pipeline of Owl: every job of `ci/gitlab/nightly-jobs.yml`. `NightlyGate` writes it after
# `templates.yml` and `nightly-jobs.yml`, so the building blocks are in the same file: an artifact-generated pipeline
# cannot include the repository's files.

stages:
  - build
  - publish

linux-clang-debug:
  extends: .night-linux-clang-debug

slow-suite:
  extends: .night-slow-suite

sanitizer-thread:
  extends: .night-sanitizer-thread

sanitizer-undefined-behavior:
  extends: .night-sanitizer-undefined-behavior

clang-tidy:
  extends: .night-clang-tidy

static-analyzer:
  extends: .night-static-analyzer

bench:
  extends: .night-bench

fuzz:
  extends: .night-fuzz

include-check:
  extends: .night-include-check

android-arm64:
  extends: .night-android-arm64

web-release:
  extends: .night-web-release

dependency-report:
  extends: .night-dependency-report

package-linux-x64:
  extends: .night-package-linux-x64

package-linux-arm64:
  extends: .night-package-linux-arm64

package-windows-x64:
  extends: .night-package-windows-x64
