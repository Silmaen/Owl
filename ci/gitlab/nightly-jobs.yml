# What each nightly job does, as hidden jobs: the nightly child pipeline (`ci/gitlab/nightly.yml`) runs them all, a
# merge request offers each one on request (`.gitlab-ci.yml`). The building blocks are in `ci/gitlab/templates.yml`.
#
# Everything here is too long for every push, or publishes: all start at once, the runners deciding the order.

# Clang Debug measures its own coverage, beside the GCC one of the merge requests.
.night-linux-clang-debug:
  extends: .build-linux
  stage: build
  variables:
    PRESET: linux-clang-debug

# The whole suite, the `slow` tests the other builds leave out included, on the release tree where a slow scenario
# takes seconds (in Debug with coverage, minutes). Neither documented nor packaged.
.night-slow-suite:
  extends: .linux
  stage: build
  variables:
    PRESET: linux-clang-release
  script:
    - poetry run python3 ci_action.py Clean "$PRESET"
    - poetry run python3 ci_action.py Build "$PRESET"
    - poetry run python3 ci_action.py Test "$PRESET"
  artifacts:
    when: always
    reports:
      junit: output/build/*/test/test/*_Report.xml

.night-sanitizer-thread:
  extends: .build-linux
  stage: build
  variables:
    PRESET: linux-sanitizer-thread

.night-sanitizer-undefined-behavior:
  extends: .build-linux
  stage: build
  variables:
    PRESET: linux-sanitizer-undefined-behavior

.night-clang-tidy:
  extends: .analysis
  stage: build
  variables:
    TOOL: tidy

.night-static-analyzer:
  extends: .analysis
  stage: build
  variables:
    TOOL: analyzer

.night-bench:
  extends: .bench
  stage: build

# Each libFuzzer target for a fixed time; the failing inputs are kept to replay them locally.
.night-fuzz:
  extends: .linux
  stage: build
  variables:
    PRESET: linux-fuzz
  script:
    - poetry run python3 ci_action.py Clean "$PRESET"
    - poetry run python3 ci_action.py Build "$PRESET"
    - poetry run python3 ci_action.py Fuzz "$PRESET"
  artifacts:
    when: on_failure
    paths:
      - output/fuzz/*/artifacts/

# Every header and source compiled alone on strict libc++: up to 26 minutes for a check that rarely fails.
.night-include-check:
  extends: .linux
  stage: build
  variables:
    PRESET: linux-include-check
  script:
    - poetry run python3 ci_action.py Clean "$PRESET"
    - poetry run python3 ci_action.py IncludeCheck "$PRESET"

# The engine and the game runner cross compiled with the NDK; no device reaches the CI yet, so the preset builds
# without the tests.
.night-android-arm64:
  extends: [.build-linux, .release-archives]
  stage: build
  image: registry.argawaen.net/builder/builder-android-ubuntu2604
  variables:
    PRESET: android-arm64
  script:
    - poetry run python3 ci_action.py BuildAndTest "$PRESET"
    - '[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] || poetry run python3 ci_action.py PublishPackage "$PRESET" -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN" --components=OwlGameRunner'

# The engine and the game runner compiled to WebAssembly with Emscripten; the tests run under Node.
.night-web-release:
  extends: [.build-linux, .release-archives]
  stage: build
  image: registry.argawaen.net/builder/builder-web-ubuntu2604
  variables:
    PRESET: web-release
  script:
    - poetry run python3 ci_action.py BuildAndTest "$PRESET"
    - '[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] || poetry run python3 ci_action.py PublishPackage "$PRESET" -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN" --components=OwlGameRunner'

# Informative: never fails.
.night-dependency-report:
  extends: .linux
  stage: build
  script:
    - poetry run python3 ci_action.py DependencyReport linux-clang-release
  artifacts:
    paths:
      - output/dependency_report.json

# --- Packages ---------------------------------------------------------------------------------------------------

# Each one builds and tests its release tree, then publishes the archives it wrote (and, on Linux x64, the
# documentation): an archive never comes from untested code. Only `main` publishes: a branch stops at the archives.
# The engine SDK and the game runner leave from the job; the Owl Nest packages wait for every runner (`assemble-nest`).

# The Owl Nest archive of a release tree (`main` only writes it), for `assemble-nest`, plus the test report. The
# documentation and coverage are published from the job itself, so they stay out of the artifact (it would blow the
# upload size, HTTP 413).
.release-archives:
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - output/build/*/OwlNest-*
    reports:
      junit: output/build/*/test/test/*_Report.xml

.night-package-linux-x64:
  extends: [.build-linux, .release-archives]
  stage: publish
  # Its own build is its gate: it does not wait for the rest of the night.
  needs: []
  variables:
    PRESET: linux-clang-release
  script:
    - poetry run python3 ci_action.py BuildAndTest "$PRESET"
    - '[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] || poetry run python3 ci_action.py PublishPackage "$PRESET" -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN" --components=OwlEngine,OwlGameRunner'
    - '[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] || poetry run python3 ci_action.py PublishDoc "$PRESET" -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN"'

# Cross compiled on x64 (Clang --target=aarch64-linux-gnu, the arm64 sysroot of the image); the tests run under
# qemu-user, in release because QEMU multiplies the cost of every instruction.
.night-package-linux-arm64:
  extends: [.build-linux, .release-archives]
  stage: publish
  needs: []
  image: registry.argawaen.net/builder/builder-cross-arm64-ubuntu2604
  variables:
    PRESET: linux-cross-arm64
  script:
    - poetry run python3 ci_action.py BuildAndTest "$PRESET"
    - '[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] || poetry run python3 ci_action.py PublishPackage "$PRESET" -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN" --components=OwlEngine,OwlGameRunner'

.night-package-windows-x64:
  extends: [.build-windows, .release-archives]
  stage: publish
  needs: []
  variables:
    PRESET: windows-clang-release
  script:
    - poetry run python3 ci_action.py BuildAndTest $env:PRESET
    - if ($env:CI_COMMIT_BRANCH -eq $env:CI_DEFAULT_BRANCH) { poetry run python3 ci_action.py PublishPackage $env:PRESET -- "--url=$env:OWL_DEPLOY_URL" "--login=$env:OWL_DEPLOY_LOGIN" --components=OwlEngine,OwlGameRunner }

# The Owl Nest packages of `main`, once every runner of the commit is built: `runners.json` (size and SHA-256 of each
# runner archive) and the Web runner added to each, then published. Owl Nest downloads the other runners.
.night-assemble-nest:
  extends: .linux
  stage: publish
  needs:
    - job: package-linux-x64
    - job: package-linux-arm64
    - job: package-windows-x64
    - job: android-arm64
    - job: web-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - poetry run python3 ci_action.py AssembleNest linux-clang-release -- --input=output/build --output=output/assembled --url=$OWL_DEPLOY_URL
    - poetry run python3 ci_action.py PublishPackage linux-clang-release -- "--url=$OWL_DEPLOY_URL" "--login=$OWL_DEPLOY_LOGIN" --folder=output/assembled --components=OwlNest
