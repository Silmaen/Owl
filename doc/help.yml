# The pages of the Owl Nest help panel and of the Doxygen page tree, in reading order: the groups in sidebar order,
# the pages in their order inside each group, paths from the repository root.
# - cmake/HelpAssets.cmake bundles exactly these pages (every doc/pages/*.md must be listed) into index.yml;
# - tools/doc/fix_md_links.py gives Doxygen the same tree: the README (main page) is the parent of the first page of
#   each group, the first page of a group the parent of the others.
# The design pages (doc/pages/design/) are plans, not help: they hang under doc/pages/design/plans.md.
Groups:
  - title: Getting started
    pages:
      - doc/pages/nest_help.md
      - doc/pages/getting_started.md
      - README.md
  - title: The editor
    pages:
      - doc/pages/editor.md
      - doc/pages/editor_viewport.md
      - doc/pages/editor_scene.md
      - doc/pages/editor_assets.md
      - doc/pages/editor_documents.md
      - doc/pages/editor_tilemaps.md
      - doc/pages/editor_hud.md
      - doc/pages/editor_play.md
      - doc/pages/editor_console.md
      - doc/pages/editor_projects.md
      - doc/pages/editor_settings.md
      - doc/pages/mcp.md
  - title: Making games
    pages:
      - doc/pages/guide_game_maker.md
      - doc/pages/scene.md
      - doc/pages/event_input.md
      - doc/pages/physics.md
      - doc/pages/sound.md
      - doc/pages/languages.md
      - doc/pages/pathfinding.md
      - doc/pages/pcg_graphs.md
  - title: Scripting
