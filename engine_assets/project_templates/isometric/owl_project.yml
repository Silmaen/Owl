FormatVersion: 1
OwlProject:
  name: Isometric
  firstScene: scenes/main.owl
  version: 0.1.0
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true
  RendererStack:
    - Type: Renderer2D
      Name: world
    - Type: RendererIsometric
      Name: iso_world
      DefaultConfig:
        TileWidth: 64
        TileHeight: 32
        ZStep: 16
        Zoom: 0
    - Type: Renderer2D
      Name: ui
