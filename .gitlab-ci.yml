# Pipeline of Owl: merge requests and the default branch. The shared building blocks are in
# `ci/gitlab/templates.yml`, the nightly jobs in `ci/gitlab/nightly.yml`.
#
# Two levels: Code Style first, then every build and analysis in parallel, none starting if it failed.
#
# - draft merge requests and `Experiment/…` branches: Code Style and Linux Clang, the fast verdict;
# - ready merge requests: the full set, minus the jobs that cannot change a verdict when only the documentation moved;
# - `main`: the builds again on the merged result, and the address sanitizer;
# - the scheduled pipeline: only the nightly gate, which runs the nightly child pipeline when `main` moved;
# - a pipeline run by hand with `NIGHTLY` = `true` (Build > Pipelines > Run pipeline, any branch): the nightly jobs
#   on that branch, whether it moved or not, publishing nothing unless it is `main`;
# - anywhere else, every job left out still shows and runs on its ▶, and `nightly-jobs` ▶ opens the nightly jobs
#   one by one;
# - a job of a push or merge request pipeline stands on an earlier success on the same tree (`BuildAndTest` for the
#   builds, `Reuse` for the others, `OWL_CI_REUSE`): a pipeline started again on the same commit only runs what is new;
# - the `ready-watch` schedule (`READY_WATCH` = `true`) starts the pipeline of a draft marked ready, which GitLab does
#   not: the draft pipeline is named `Draft merge request` (`workflow:name`), `ReadyPipelines` looks for those.
#
# The merge waits for the last pipeline (Settings > Merge requests > Pipelines must succeed).

include:
  - local: ci/gitlab/templates.yml

workflow:
  name: $PIPELINE_NAME
  rules:
    # Same test as `.ready-merge-request`: the name tells `ReadyPipelines` the jobs of the draft were left out.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
      variables:
        PIPELINE_NAME: Draft merge request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - style
  - build
  - nightly

variables:
  BENCH_CALIBRATE:
    value: "false"
    description: "true: run the benchmarks several times and publish a proposed baseline instead of comparing."
  BENCH_ROUNDS:
    value: "5"
    description: "Benchmark runs of a calibration."
  NIGHTLY:
    value: "false"
    description: "true: run the nightly jobs on this branch instead of the usual ones."
  PIPELINE_NAME: ""
  READY_WATCH:
    value: "false"
    description: "true (the ready-watch schedule): start the pipeline of the drafts marked ready, nothing else."

# --- When a job runs --------------------------------------------------------------------------------------------

# Every pipeline but the nightly ones.
.always:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - when: on_success

# A job a pipeline leaves out still shows, waiting for its ▶: it never blocks the pipeline nor the merge.
.by-hand:
  rules:
    - when: manual
      allow_failure: true

# Ready merge requests that change more than the documentation, and `main`.
.ready:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - !reference [.ready-merge-request, rules]
    - !reference [.by-hand, rules]

# Ready merge requests that change the C++ or what builds it, and pipelines run by hand: the jobs `main` runs at
# night only. A merge request on the sample games, the Engine Demo or the tools cannot move their verdict.
.ready-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
      allow_failure: true
    - !reference [.draft-or-experiment, rules]
    - changes:
        - .gitlab-ci.yml
        - .clang-tidy
        - CMakeLists.txt
        - CMakePresets.json
        - conan.lock
        - conanfile.py
        - ci/**/*
        - cmake/**/*
        - conan/**/*
        - engine_assets/**/*
        - source/**/*
        - test/**/*
    - !reference [.by-hand, rules]

# Waiting for their ▶ in drafts and `Experiment/…`.
.draft-or-experiment:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
      when: manual
      allow_failure: true
    # Exploratory work does not pay for the full set.
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^Experiment\//
      when: manual
      allow_failure: true

# Waiting for their ▶ in drafts and `Experiment/…`; running when anything but the documentation changed.
.ready-merge-request:
  rules:
    - !reference [.draft-or-experiment, rules]
    # Everything but `doc/`, `.claude/`, the root Markdown files and LICENSE.
    - changes:
        - .gitlab-ci.yml
        - .clang-format
        - .clang-tidy
        - .gitattributes
        - .gitignore
        - CMakeLists.txt
        - CMakePresets.json
        - CPackConfig.cmake
        - DoxyfileTemplate
        - ci_action.py
        - conan.lock
        - conanfile.py
        - docker_run.sh
        - gcovr.cfg
        - poetry.lock
        - pyproject.toml
        - ci/**/*
        - cmake/**/*
        - conan/**/*
        - engine_assets/**/*
        - engine_demo/**/*
        - samples/**/*
        - source/**/*
        - test/**/*
        - tools/**/*

# Only on their ▶, in every pipeline but the nightly ones: the presets no other job builds.
.on-demand:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - !reference [.by-hand, rules]

# Pushes to `main` and pipelines run by hand; by hand in a merge request.
.main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - !reference [.by-hand, rules]

.after-style:
  stage: build
  needs:
    - job: code-style
      artifacts: false

# --- Style ------------------------------------------------------------------------------------------------------

# The gate everything waits for, documentation-only merge requests included: codespell and Markdown are its job.
code-style:
  extends: [.linux, .always]
  stage: style
  script:
    - poetry run python3 ci_action.py Reuse linux-clang-debug && exit 0 || true
    - poetry run python3 ci_action.py CodeStyle linux-clang-debug
  artifacts:
    when: always
    reports:
      codequality: output/code-quality/code-style.json

# --- Builds -----------------------------------------------------------------------------------------------------

# The fast verdict, on drafts and documentation-only merge requests too (it builds Doxygen): the release tree and
# its tests; on `main` its archives too, to prove CPack still works.
linux-clang-release:
  extends: [.build-linux, .after-style, .always]
  variables:
    PRESET: linux-clang-release

# The coverage gate: more than one point below the last successful job of `main` fails it.
linux-gcc-debug:
  extends: [.build-linux, .after-style, .ready]
  variables:
    PRESET: linux-gcc-debug

# The single Windows runner is the bottleneck: one release tree, ready merge requests only. No coverage:
# `gcovr.cfg` leaves the Windows-only code out, Linux measures the rest.
windows-clang-release:
  extends: [.build-windows, .after-style, .ready]
  variables:
    PRESET: windows-clang-release

# Off merge requests: it held a runner for 25 minutes each.
sanitizer-address:
  extends: [.build-linux, .after-style, .main]
  variables:
    PRESET: linux-sanitizer-address

# On their ▶ only, never blocking: the presets no job builds otherwise. Same steps as the builds above.
windows-gcc-release:
  extends: [.build-windows, .on-demand]
  stage: build
  needs: []
  variables:
    PRESET: windows-gcc-release

windows-gcc-debug:
  extends: [.build-windows, .on-demand]
  stage: build
  needs: []
  variables:
    PRESET: windows-gcc-debug

linux-gcc-release:
  extends: [.build-linux, .on-demand]
  stage: build
  needs: []
  variables:
    PRESET: linux-gcc-release

# Every optional engine module off (`OWL_MODULE_*`).
linux-clang-minimal:
  extends: [.build-linux, .on-demand]
  stage: build
  needs: []
  variables:
    PRESET: linux-clang-minimal

# --- Analyses ---------------------------------------------------------------------------------------------------

clang-tidy:
  extends: [.analysis, .after-style, .ready-only]
  variables:
    TOOL: tidy

bench:
  extends: [.bench, .after-style, .ready-only]

# --- Drafts marked ready ---------------------------------------------------------------------------------------

# A schedule of its own (Build > Pipeline schedules, `main`, every 10 minutes, `READY_WATCH` = `true`) runs this job
# alone: it starts the pipeline of each draft marked ready since its draft pipeline (`ReadyPipelines`). No tag: every
# runner with "Run untagged jobs" takes it, the Docker ones in the build image, a shell one (Windows) directly; the
# script reads the same in bash and PowerShell.
ready-watch:
  image: $LINUX_IMAGE
  stage: style
  variables:
    # As in `.windows`: MSYS2's Python makes a venv Poetry cannot use.
    POETRY_VIRTUALENVS_USE_POETRY_PYTHON: "true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $READY_WATCH == "true"
  interruptible: false
  script:
    - poetry run python ci_action.py ReadyPipelines linux-clang-release

# --- Nightly ----------------------------------------------------------------------------------------------------

# The nightly schedule, and a pipeline run by hand with `NIGHTLY` = `true`.
.nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $READY_WATCH != "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $NIGHTLY == "true"

# The schedule (Build > Pipeline schedules, `main`, 02:00) runs these two only. The gate writes the child pipeline:
# the nightly jobs when `main` moved since the last successful nightly (or always, when run by hand), else a single
# job saying so.
nightly-gate:
  extends: .linux
  stage: nightly
  rules:
    - !reference [.nightly, rules]
  script:
    - poetry run python3 ci_action.py NightlyGate linux-clang-release
  artifacts:
    paths:
      - output/nightly.yml

nightly:
  stage: nightly
  inherit:
    default: false
  rules:
    - !reference [.nightly, rules]
  needs: [nightly-gate]
  trigger:
    include:
      - artifact: output/nightly.yml
        job: nightly-gate
    strategy: depend
    # The child has the YAML variables of its own file. Forwarded, they would be expanded in this trigger job, which
    # has no `CI_PROJECT_DIR`: the Poetry cache would land in `/.cache`. The schedule's variables still go down.
    forward:
      yaml_variables: false
      pipeline_variables: true

# Every nightly job on this branch, one ▶ each, as a child pipeline: ▶ here opens it, then ▶ the job to run. The
# usual pipeline never waits for it, and nothing in it publishes but `main`.
nightly-jobs:
  stage: nightly
  inherit:
    default: false
    variables: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $NIGHTLY == "true"
      when: never
    - !reference [.by-hand, rules]
  needs: []
  variables:
    NIGHTLY_PICK: "true"
  trigger:
    include:
      - local: ci/gitlab/templates.yml
      - local: ci/gitlab/nightly.yml
    # Only its own `NIGHTLY_PICK` goes down with the YAML variables (`inherit` keeps the global ones here).
    forward:
      yaml_variables: true
      pipeline_variables: true
